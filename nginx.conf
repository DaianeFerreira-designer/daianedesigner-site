map $arg_v $cache_estatico_versionado {
    default "public, max-age=3600";
    "~^[0-9]{8}-[0-9]+$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;
    gzip_comp_level 6;

    # Metadados e configurações não devem ser servidos como arquivos públicos.
    location ~ /\. {
        deny all;
    }

    location ~ ^/(?:Dockerfile|nginx\.conf|composer\.(?:json|lock))$ {
        deny all;
    }

    location ~ ^/(?:config|vendor|partials|scripts)/ {
        deny all;
    }

    location = / {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        try_files /index.html =404;
    }

    location = /index {
        return 301 /;
    }

    location ^~ /database/ {
        deny all;
    }

    location = /orcamento {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/orcamento.php;
        fastcgi_param SCRIPT_NAME /orcamento.php;
    }

    location = /politica-de-privacidade {
        try_files /politica-de-privacidade.html =404;
    }

    location = /politica-de-cookies {
        try_files /politica-de-cookies.html =404;
    }

    location = /termos-de-uso {
        try_files /termos-de-uso.html =404;
    }

    location = /orcamento.php {
        return 301 /orcamento;
    }

    location = /politica.php {
        return 301 /politica-de-privacidade;
    }

    location = /index.php {
        return 301 /;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    location ~ ^/(?:style\.css|script\.js)$ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/css application/javascript text/javascript;
        add_header Cache-Control $cache_estatico_versionado;
        try_files $uri =404;
    }

    location ~ ^/assets/(?:hero-daiane-desktop|hero-desktop-sem-perdas|mentoria-ela-(?:560|960))-v[0-9]+\.webp$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/assets/hero-(?:desktop|mobile)-v[0-9]+\.avif$ {
        default_type image/avif;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /assets/vendor/ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_types application/javascript text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
