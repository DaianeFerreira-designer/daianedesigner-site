server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Metadados e configurações não devem ser servidos como arquivos públicos.
    location ~ /\. {
        deny all;
    }

    location ~ ^/(?:Dockerfile|nginx\.conf|composer\.(?:json|lock))$ {
        deny all;
    }

    location ~ ^/(?:config|vendor|partials)/ {
        deny all;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index {
        return 301 /;
    }

    location ^~ /database/ {
        deny all;
    }

    location = /orcamento {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/orcamento.php;
        fastcgi_param SCRIPT_NAME /orcamento.php;
    }

    location = /politica-de-privacidade {
        try_files /politica-de-privacidade.html =404;
    }

    location = /politica-de-cookies {
        try_files /politica-de-cookies.html =404;
    }

    location = /termos-de-uso {
        try_files /termos-de-uso.html =404;
    }

    location = /orcamento.php {
        return 301 /orcamento;
    }

    location = /politica.php {
        return 301 /politica-de-privacidade;
    }

    location = /index.php {
        return 301 /;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
